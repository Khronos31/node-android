name: Cross-compile EPGStation 3 native dependencies

on:
  pull_request:
    paths:
      - "epg3/**"
      - ".github/workflows/epg3-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-probe:
    name: EPGStation beta2 native dependency / ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android NDK and build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential python3 make binutils
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Cross-compile actual upstream native packages
        shell: bash
        run: |
          set -euo pipefail
          bash epg3/build-android-native.sh "${{ matrix.abi }}"
      - name: Save native dependency probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epgstation-beta2-native-${{ matrix.abi }}-${{ github.run_number }}
          path: |
            epg3/.generated/output/${{ matrix.abi }}
            epg3/package-lock.json
          if-no-files-found: warn
          retention-days: 7
