name: Build Node.js for Android

on:
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "scripts/**"
      - "patches/**"
      - "versions/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-patches:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate source lock and apply patches strictly
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/*.py
          python3 -m unittest discover -s tests -p 'test_elf_pages.py' -v
          node --check tests/smoke.js
          export NODE_ANDROID_WORK_DIR="$PWD/.work/source-check"
          bash scripts/fetch-source.sh
          bash scripts/apply-patches.sh "$NODE_ANDROID_WORK_DIR/node-v24.21.0"
          python3 scripts/adjust-node-gyp.py "$NODE_ANDROID_WORK_DIR/node-v24.21.0"
          # Verify idempotence: applying the same patches a second time must not alter files.
          bash scripts/apply-patches.sh "$NODE_ANDROID_WORK_DIR/node-v24.21.0"
          python3 scripts/adjust-node-gyp.py "$NODE_ANDROID_WORK_DIR/node-v24.21.0"

  build:
    needs: source-and-patches
    # This is a stacked PR onto the existing long-running Node build PR.
    # Validate the cache plan without launching a duplicate multi-hour build.
    if: ${{ github.event_name != 'pull_request' || github.base_ref != 'feat/node24-android-build' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        abi: ["armeabi-v7a", "arm64-v8a"]
    steps:
      - uses: actions/checkout@v4
      - name: Install host toolchain prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xz-utils patch ccache gcc-multilib g++-multilib
      - uses: android-actions/setup-android@v3
        with:
          # sdkmanager's old 'tools' package was removed; avoid the action default.
          packages: platform-tools
      - name: Install pinned Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/27.0.12077973" >> "$GITHUB_ENV"
      # Cache host LLVM by Node source pin and ABI-specific workspace path.
      # The download script verifies the SHA-256 on initial download.
      - name: Restore V8 host LLVM
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: .work/${{ matrix.abi }}/llvm-host
          key: node24-llvm-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.abi }}-${{ hashFiles('versions/node-24.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            node24-llvm-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.abi }}-${{ hashFiles('versions/node-24.json') }}-

      # Restore compiler results, NOT entire V8/Ninja out directories.
      # A rolling per-attempt key ensures partial progress from failed builds
      # is saved; same-version later runs can restore the newest prefix match.
      - name: Restore ABI-isolated ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache/${{ matrix.abi }}
          key: node24-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.abi }}-${{ hashFiles('versions/node-24.json', 'patches/node-24/*.patch', 'patches/stubs/*', 'scripts/build.sh', 'scripts/adjust-node-gyp.py', 'scripts/prepare-host-llvm.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            node24-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.abi }}-${{ hashFiles('versions/node-24.json', 'patches/node-24/*.patch', 'patches/stubs/*', 'scripts/build.sh', 'scripts/adjust-node-gyp.py', 'scripts/prepare-host-llvm.sh') }}-

      - name: Build and inspect Android Node PIE
        id: node-build
        env:
          NODE_ANDROID_JOBS: "4"
          NODE_ANDROID_USE_CCACHE: "1"
          CCACHE_DIR: ${{ github.workspace }}/.ccache/${{ matrix.abi }}
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 1500M
          CCACHE_COMPRESS: "true"
        run: |
          chmod +x scripts/*.sh
          echo "Parallel jobs=$NODE_ANDROID_JOBS / CPUs=$(nproc)"
          free -h
          df -h .
          bash scripts/build.sh "${{ matrix.abi }}"

      - name: Report cache statistics and presence
        id: cache-check
        if: ${{ !cancelled() && steps.node-build.outcome != 'skipped' }}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache/${{ matrix.abi }}
        run: |
          ccache --show-stats || true
          du -sh "$CCACHE_DIR" 2>/dev/null || true
          if [[ -d "$CCACHE_DIR" && -n "$(ls -A "$CCACHE_DIR")" ]]; then
            echo "ccache_present=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ -x ".work/${{ matrix.abi }}/llvm-host/bin/clang" ]]; then
            echo "llvm_present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save compiler cache, including partial failed builds
        if: ${{ !cancelled() && steps.cache-check.outputs.ccache_present == 'true' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ccache/${{ matrix.abi }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Save pinned host LLVM
        if: ${{ !cancelled() && steps.cache-check.outputs.llvm_present == 'true' && steps.llvm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .work/${{ matrix.abi }}/llvm-host
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: node-v24.21.0-android-${{ matrix.abi }}
          path: dist/node-v24.21.0-android-${{ matrix.abi }}.tar.xz
          if-no-files-found: error
          retention-days: 14
