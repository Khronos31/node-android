name: Promote verified Node Android binary release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "release/**"
      - "docs/releases.md"
      - "README.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag (e.g. v24.21.0-android.1)"
        required: true
        type: string
      build_run_id:
        description: "Successful two-ABI Node Android workflow run ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test release validation
        run: |
          set -euo pipefail
          python3 -m py_compile release/verify_artifacts.py
          python3 -m unittest discover -s release/tests -p 'test_*.py' -v

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate-release-scripts
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable existing tag from default branch
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/$INPUT_TAG^{commit}")"
          git merge-base --is-ancestor "$TAG_COMMIT" "$GITHUB_SHA" || {
            echo "::error::Release tag commit is not an ancestor of main"
            exit 2
          }
          # The release tooling may have been fixed since tagging, but inputs
          # controlling the binary output must be byte-identical to the tag.
          git diff --quiet "$TAG_COMMIT" "$GITHUB_SHA" -- \
            versions/node-24.json patches/ scripts/build.sh \
            scripts/fetch-source.sh scripts/apply-patches.sh \
            scripts/prepare-host-llvm.sh scripts/adjust-node-gyp.py \
            scripts/inspect-elf.py || {
              echo "::error::Build source/toolchain fingerprint drift since tag"
              exit 2
            }
          echo "TAG_COMMIT=$TAG_COMMIT" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain)"
      - name: Validate successful source build and ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/source-run.json"
          RUN_HEAD="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["id"] == int(sys.argv[2]); assert r["status"] == "completed" and r["conclusion"] == "success"; assert r["name"] == "Build Node.js for Android"; assert r["repository"]["full_name"] == "Khronos31/node-android"; print(r["head_sha"])' "$RUNNER_TEMP/source-run.json" "$RUN_ID")"
          git merge-base --is-ancestor "$RUN_HEAD" "$TAG_COMMIT" || {
            echo "::error::Build head must be an ancestor of release tag"
            exit 2
          }
      - name: Download pinned binary artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run_id }}
          pattern: node-v24.21.0-android-*
          merge-multiple: true
          path: release-assets
          github-token: ${{ github.token }}
      - name: Validate exact archives and create provenance
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          python3 release/verify_artifacts.py \
            --repo-root . \
            --assets release-assets \
            --run-json "$RUNNER_TEMP/source-run.json" \
            --run-id "$RUN_ID" \
            --tag "$INPUT_TAG" \
            --release-commit "$TAG_COMMIT" \
            --tool-commit "$GITHUB_SHA"
          (cd release-assets && sha256sum -c SHA256SUMS)
      - name: Publish first Android port pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$INPUT_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release already exists for this tag"
            exit 3
          fi
          gh release create "$INPUT_TAG" \
            release-assets/node-v24.21.0-android-armeabi-v7a.tar.xz \
            release-assets/node-v24.21.0-android-arm64-v8a.tar.xz \
            release-assets/SHA256SUMS \
            release-assets/RELEASE-METADATA.json \
            -R "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Node.js 24.21.0 for Android (port build 1)" \
            --notes-file release/NOTES.md \
            --prerelease \
            --latest=false
